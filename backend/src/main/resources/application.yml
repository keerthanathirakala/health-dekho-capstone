spring:
  application:
    name: health-dekho
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/healthdekho}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  ai:
    bedrock:
      aws:
        region: ${AWS_REGION:us-east-1}
        access-key: ${AWS_ACCESS_KEY_ID:}
        secret-key: ${AWS_SECRET_ACCESS_KEY:}
        session-token: ${AWS_SESSION_TOKEN:}
      converse:
        chat:
          options:
            model: ${BEDROCK_CONVERSE_MODEL:us.anthropic.claude-sonnet-4-6}
            temperature: 0.2

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-this-before-production-32-bytes-minimum}
    expiration: ${JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    model-name: ${BEDROCK_CONVERSE_MODEL:us.anthropic.claude-sonnet-4-6}
    model-version: ${AI_MODEL_VERSION:configured}
    prompt-version: v1

---
spring:
  config:
    activate:
      on-profile: dev
app:
  seed-demo-data: true